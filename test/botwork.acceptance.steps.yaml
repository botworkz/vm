type: botforge/fragment
inputs:
  plugins:
    type: string
    default: |
      echo
  port:
    type: number
    default: 80
  workspace:
    type: string
    default: testws

steps:
- uses: "@://test/botwork.admin.steps.yaml"
  with:
    port: ${{ inputs.port }}

- on: host
  name: Botwork acceptance (server health)
  run: |
    . test/botwork-acceptance.sh

    HEALTH_URL="${BASE_URL}/api/health"
    api_request GET "${HEALTH_URL}" ""

    if [[ "${API_STATUS}" != "200" ]]; then
      fail "expected HTTP 200 from /api/health" "${HEALTH_URL}" "${API_STATUS}" "${API_BODY}"
    fi

    status="$(echo "${API_BODY}" | jq -r '.status // empty')"
    if [[ "${status}" != "ready" ]]; then
      fail 'expected `"status":"ready"` from /api/health' "${HEALTH_URL}" "${API_STATUS}" "${API_BODY}"
    fi

- uses: "@://test/botwork.user.steps.yaml"
  with:
    tenant: testuser
    workspace: ${{ inputs.workspace }}
    plugins: ${{ inputs.plugins }}
    port: ${{ inputs.port }}
    mode_self: true

- uses: "@://test/botwork.user.steps.yaml"
  with:
    tenant: testuser0
    workspace: ${{ inputs.workspace }}
    plugins: ${{ inputs.plugins }}
    port: ${{ inputs.port }}
    mode_self: true

- uses: "@://test/botwork.user.steps.yaml"
  with:
    tenant: testuser1
    workspace: ${{ inputs.workspace }}
    plugins: ${{ inputs.plugins }}
    port: ${{ inputs.port }}
    mode_self: true

- uses: "@://test/botwork.user.steps.yaml"
  with:
    tenant: testuser0
    actor_tenant: testuser
    workspace: ${{ inputs.workspace }}
    plugins: ${{ inputs.plugins }}
    port: ${{ inputs.port }}
    mode_foreign: true

- uses: "@://test/botwork.user.steps.yaml"
  with:
    tenant: testuser0
    workspace: ${{ inputs.workspace }}
    plugins: ${{ inputs.plugins }}
    port: ${{ inputs.port }}
    mode_anon: true
