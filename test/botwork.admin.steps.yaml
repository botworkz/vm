type: botforge/fragment
inputs:
  port:
    type: number
    required: true

steps:
- on: host
  name: Botwork admin (env setup)
  run: |
    WORK_DIR="$(mktemp -d /tmp/botwork-acceptance.XXXXXX)"
    SMOKE_BASE_URL=http://127.0.0.1:${{ inputs.port }}

    . test/botwork-acceptance.sh

    ADMIN_URL="${BASE_URL}/api/tenants"
    echo "ADMIN_URL=${ADMIN_URL}" >> "$BOTFORGE_ENV"
    echo "WORK_DIR=${WORK_DIR}" >> "$BOTFORGE_ENV"
    echo "SMOKE_BASE_URL=${SMOKE_BASE_URL}" >> "$BOTFORGE_ENV"

- name: Botwork acceptance (admin provision)
  run: |
    /usr/local/bin/botctl admin-key generate
    ADMIN_BEARER=$(/usr/local/bin/botctl admin-key get)
    echo "ADMIN_BEARER=${ADMIN_BEARER}" >> "$BOTFORGE_ENV"

- on: host
  name: Botwork acceptance (admin checks tenants)
  run: |
    . test/botwork-acceptance.sh

    admin_check_tenants testuser

- on: host
  name: Botwork admin (create tenant ${{ args.name }})
  for:
  - name: testuser
  - name: testuser0
  - name: testuser1
  run: |
    . test/botwork-acceptance.sh
    admin_create_tenant "${{ args.name }}"

- on: host
  name: Botwork acceptance (admin checks tenants)
  run: |
    . test/botwork-acceptance.sh

    admin_check_tenants testuser,testuser0,testuser1
